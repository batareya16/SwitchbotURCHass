name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the SwitchBot URC Bridge
        uses: actions/checkout@v4
        with:
          repository: batareya16/switchbot-urc-addon
          ref: e982ed51a3012a29d12edff2c8191d104a2caa16
          path: addons
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest voluptuous cryptography
      - run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_panel_pages.cjs
